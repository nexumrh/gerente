name: narracao-video
on:
  push:
    branches: [narracao-video]
    paths: ['.github/narracao.py', '.github/workflows/narracao.yml']
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install edge-tts
      - run: python .github/narracao.py
      - run: |
          mv saida.mp4 nexumcell-instalacao-usb-completo.mp4
          git config user.name "nexum-bot"; git config user.email "bot@users.noreply.github.com"
          git add nexumcell-instalacao-usb-completo.mp4
          git commit -m "Vídeo da instalação por USB com narração"
          git push
